  <script>
    // Clave PÚBLICA de Cloudflare Turnstile (CAPTCHA). Vacía = CAPTCHA apagado. Solo se completa después de crear el
    // sitio en Cloudflare y ANTES de activar el CAPTCHA en Supabase (ver supabase/README.md, "Protección contra abuso").

    window.MASCODATA_TURNSTILE_KEY = '';

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Paleta y tipografía del Manual de marca Mascodata v2 (septiembre 2026):
    // índigo (marca), celeste (fondos), coral (acento) y Manrope. Se reusan
    // los mismos NOMBRES de color que ya usaba toda la app (brand/teal/gray/
    // red/amber/green) para no tocar las clases de cada vista; solo cambian
    // los valores. Regla del manual: el verde (`green`), el ámbar (`amber`) y
    // la frambuesa (`red`) son SOLO para estados; `teal` pasa a ser el coral
    // de acento (íconos, numeración, destacados), nunca para texto largo.
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'system-ui', 'sans-serif'],
          },
          borderRadius: {
            xl: '14px',
            '2xl': '20px',
            '3xl': '28px',
          },
          boxShadow: {
            sm: '0 1px 2px 0 rgb(37 42 98 / 0.06), 0 2px 8px 0 rgb(37 42 98 / 0.05)',
            md: '0 8px 24px -4px rgb(37 42 98 / 0.10)',
            lg: '0 20px 48px -8px rgb(37 42 98 / 0.12)',
          },
          colors: {
            // brand: índigo vivo (#4C5FD7) — botón principal, enlaces, foco.
            brand: {
              50:  '#f1f4ff',
              100: '#e7f1ff',
              200: '#c9d2f5',
              300: '#9fadeb',
              400: '#7686e2',
              500: '#4c5fd7',
              600: '#3e50c4',
              700: '#303a88',
              800: '#252a62',
              900: '#191c45',
            },
            // teal → coral de acento (#FF8A6B). Los pasos 600+ son coral
            // oscuro para poder usarse como texto con contraste.
            teal: {
              50:  '#fff0eb',
              100: '#ffe2d9',
              200: '#ffc7b7',
              300: '#ffa88f',
              400: '#ff8a6b',
              500: '#f27152',
              600: '#c7492b',
              700: '#9e3a22',
              800: '#772d1a',
              900: '#4f1d11',
            },
            // green: éxito / "al día" (#237B58). Solo estados.
            green: {
              50:  '#f1f8f2',
              100: '#e7f4e8',
              200: '#c3e3cb',
              300: '#93cba4',
              400: '#54a57b',
              500: '#237b58',
              600: '#1c6647',
              700: '#175339',
              800: '#11402c',
              900: '#0b2b1e',
            },
            // red: error / vencido / destructivo (#B4234A, frambuesa).
            red: {
              50:  '#fdf2f5',
              100: '#fbe7ec',
              200: '#f0b9c6',
              300: '#e28ba1',
              400: '#cc5877',
              500: '#b4234a',
              600: '#9b1d3f',
              700: '#821835',
              800: '#69132b',
              900: '#4e0e20',
            },
            // amber: atención / próximo a vencer (#AD5D12).
            amber: {
              50:  '#fff8ec',
              100: '#fff1dc',
              200: '#f2d2a3',
              300: '#e3ae6b',
              400: '#c98037',
              500: '#ad5d12',
              600: '#95500f',
              700: '#7c430d',
              800: '#63360a',
              900: '#4a2807',
            },
            // gray: neutro FRÍO teñido de índigo (texto #252A62, secundario
            // #626A8A, bordes #DFE3F4, fondo #F8F9FF).
            gray: {
              50:  '#f8f9ff',
              100: '#f1f4ff',
              200: '#dfe3f4',
              300: '#cfd5ee',
              400: '#9299ba',
              500: '#626a8a',
              600: '#4d5578',
              700: '#3a4166',
              800: '#2d3263',
              900: '#252a62',
            },
            // Alias con el nombre literal del token del manual.
            surface: { DEFAULT: '#f8f9ff', raised: '#ffffff', sunken: '#f1f4ff' },
            ink: { DEFAULT: '#252a62', muted: '#626a8a' },
            info: { DEFAULT: '#3856b8', soft: '#eaf0ff' },
          }
        }
      }
    }
  </script>

  <script>
    // Analítica de producto (PostHog). Sin autocapture ni grabación de sesiones:
    // en Mascodata se verían nombres, teléfonos y datos de salud. Solo se envían
    // los eventos explícitos de track() (js/app.js). No corre en localhost para
    // no mezclar pruebas con datos reales.
    // Tras OAuth/magic link/recuperación, la URL trae tokens en el fragmento (#access_token=…)
    // o en la query (?code=, ?token=, ?invite=). Se borran antes de enviar cualquier evento.
    function mascodataScrubUrl(u) {
      if (typeof u !== 'string') return u;
      try {
        var url = new URL(u, location.origin);

          .forEach(function (k) { url.searchParams.delete(k); });
        return url.toString();
      } catch (e) { return u.split('#')[0].split('?')[0]; }
    }
    function mascodataScrubEvent(ev) {

      });
      return ev;
    }

      posthog.init('phc_zJSa3syhZs6hudWdwTUxAkVNVFzsxYKjbWvKve84N982', {

        person_profiles: 'identified_only',
        capture_pageview: 'history_change',

      });
